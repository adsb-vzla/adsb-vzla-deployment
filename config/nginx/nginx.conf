# ***** CONFIGURACIÓN GENERAL DEL SERVIDOR *****
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ***** CARPETA RAÍZ DONDE ESTÁ EL SISTEMA ADSB-VZLA *****
    root /var/www/html;
    index index.html index.htm;

    # ***** 1. RUTAS DE LA API (FLASK Y DJANGO) *****

    # ***** PROXY PARA TU BACKEND DE FLASK (AUTH) *****
    location /auth-api/ {
        proxy_pass http://auth:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ***** PROXY PARA FLIGHT PLANS (DJANGO) *****
    location /flight-plans/ {
        proxy_pass http://flight-plans:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ***** ARCHIVOS ESTÁTICOS DE DJANGO (CSS/JS DE FLIGHT PLANS) *****
    location /static/ {
        alias /home/adsbvzla/flight-plans/staticfiles/;
    }

    # ***** 2. RUTAS DE TAR1090 (SVZM) *****

    # ***** REDIRECCIÓN DE MINÚSCULAS A MAYÚSCULAS *****
    location ~* ^/svzm$ {
        absolute_redirect off;
        return 301 /SVZM/;
    }
    location ~* ^/svzm/(.*)$ {
        absolute_redirect off;
        return 301 /SVZM/$1;
    }

    # ***** REDIRECCIÓN AL LOGIN *****
    location = /SVZM/ {
        absolute_redirect off;
        return 302 /SVZM/login.html;
    }

    # ***** ARCHIVOS ESTÁTICOS DE TAR1090 *****
    location ^~ /SVZM/ {
        alias /var/www/html/;
        try_files $uri =404;
        absolute_redirect off;
    }

    # ***** ARCHIVOS DE CONFIGURACIÓN SIN CACHÉ *****
    location = /SVZM/config.js {
        alias /var/www/html/config.js;
        add_header Cache-Control "no-cache";
    }

    # ***** 3. DATOS DINÁMICOS (READSB) *****
    location /SVZM/data/ {
        alias /run/readsb-a/;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }

    location /SVZM/data-receiver-a/ { 
        alias /run/readsb-a/; 
        default_type application/json; 
    
    }
    location /SVZM/data-receiver-b/ { 
        alias /run/readsb-b/; 
        default_type application/json; 
    }

    location /SVZM/data-receiver-c/ { 
        alias /run/readsb-c/; 
        default_type application/json; 
    }

    location /SVZM/data-receiver-d/ { 
        alias /run/readsb-d/; 
        default_type application/json; 
    }

    location /SVZM/chunks/ { 
        alias /run/tar1090/; 
    }

    location /SVZM/globe_history/ { 
        alias /var/globe_history/; 
    }

    # ***** 4. MAPAS Y ELEVACIÓN *****

    # ***** MAPAS OFFLINE *****
    location /SVZM/osm_tiles_offline/ {
        alias /usr/local/share/osm_tiles_offline/;
    }

    # ***** CGI PARA LA ELEVACIÓN *****
    location /cgi-bin/ {
        gzip off;
        root /usr/lib;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib$fastcgi_script_name;
    }

}