# ***** CONFIGURACIÓN GENERAL DE LIGHTTPD *****
server.modules = (
    "mod_access",
    "mod_accesslog",
    "mod_alias",
    "mod_compress",
    "mod_redirect",
    "mod_rewrite",
    "mod_cgi",
    "mod_proxy",
    "mod_fastcgi"
)

server.document-root        = "/var/www/html"
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )
server.errorlog             = "/var/log/lighttpd/error.log"
server.pid-file             = "/var/run/lighttpd.pid"
server.username             = "www-data"
server.groupname            = "www-data"
server.port                 = 80

# ***** REGLAS PARA LA APLICACIÓN PRINCIPAL (TAR1090) *****

# ***** REDIRECCIÓN DE /SVZM A /SVZM/ (CASE-INSENSITIVE) *****
$HTTP["url"] =~ "(?i)^/svzm" {
    $HTTP["url"] !~ "^/SVZM/" {
        url.redirect += ( "^/(?i)svzm/?$" => "/SVZM/" )
        url.redirect += ( "^/(?i)svzm/(.+)$" => "/SVZM/$1" )
    }
}

# ***** REDIRECCIÓN A LOGIN *****
$HTTP["url"] =~ "^/SVZM/?$" {
    url.redirect = (
        "^/SVZM/?$" => "/SVZM/login.html"
    )
}

# ***** ALIAS PARA LOS ARCHIVOS DE LA APLICACIÓN *****
alias.url += (
  "/SVZM/data/" => "/run/readsb-a/",
  "/SVZM/chunks/" => "/run/tar1090/",
  "/SVZM/globe_history/" => "/var/globe_history/",
  "/SVZM/aircraft_sil/" => "/usr/local/share/tar1090/aircraft_sil/",
  "/SVZM/osm_tiles_offline/" => "/usr/local/share/osm_tiles_offline/",
  "/SVZM/openfreemap_offline/" => "/usr/local/share/openfreemap_offline/mnt/",
  "/SVZM/mapdata/" => "/usr/local/share/mapdata/",
  "/SVZM/" => "/var/www/html/"
)

# ***** ALIAS PARA LOS MÚLTIPLES RECEPTORES *****
alias.url += (
  "/SVZM/data-receiver-a/" => "/run/readsb-a/",
  "/SVZM/data-receiver-b/" => "/run/readsb-b/",
  "/SVZM/data-receiver-c/" => "/run/readsb-c/",
  "/SVZM/data-receiver-d/" => "/run/readsb-d/"
)

# ***** CONFIGURACIÓN DEL CGI (ELEVACIÓN) *****

# ***** HABILITAR CGI EN LA CARPETA ESPECÍFICA *****
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "" )
    alias.url += ( "/cgi-bin/" => "/usr/lib/cgi-bin/" )
}

# ***** PROXY PARA LA API DE FLASK *****
$HTTP["url"] =~ "^/auth-api/" {
    proxy.server = ( "" => ( ( "host" => "auth", "port" => 5000 ) ) )
    proxy.header = ( "upgrade" => "enable" )
}

# ***** PROXY PARA FLIGHT PLANS *****
$HTTP["url"] =~ "^/flight_plans/" {
    proxy.server = ( "" => ( ( "host" => "flight-plans", "port" => 8000 ) ) )
    proxy.header = ( "upgrade" => "enable" )
}

# ***** CACHÉ Y COMPRESIÓN PARA ARCHIVOS ESTÁTICOS *****
$HTTP["url"] =~ "^/SVZM/.*\.(js|css)$" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600"
    )
}

$HTTP["url"] =~ "^/SVZM/config.js$" {
    setenv.add-response-header += (
        "Cache-Control" => "no-cache"
    )
}