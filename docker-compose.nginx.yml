# ***** VERSIÓN DEL FORMATO DE DOCKER COMPOSE *****
version: '3.8'

services:
  # ***** CONTENEDOR WEB (NGINX) *****
  web:
    # ***** INDICA QUÉ DOCKERFILE USAR PARA CONSTRUIR ESTE CONTENEDOR *****
    build:
      context: .
      dockerfile: Dockerfile.nginx
    # ***** NOMBRE DEL CONTENEDOR EN EL SISTEMA *****
    container_name: adsb_web_nginx
    # ***** POLÍTICA DE REINICIO (SE REINICIA SI FALLA O SI EL SERVIDOR SE REINICIA) *****
    restart: unless-stopped
    # ***** MAPEO DE PUERTOS (PUERTO DEL HOST : PUERTO DEL CONTENEDOR) *****
    ports:
      - "80:80"
    # ***** VOLÚMENES (CARPETAS COMPARTIDAS ENTRE EL HOST Y EL CONTENEDOR) *****
    volumes:
      # ***** CARPETA HTML DE TAR1090 (CLONADA DE TU REPOSITORIO) *****
      - /usr/local/share/tar1090/html:/var/www/html
      # ***** MAPAS OFFLINE (SE DESCARGAN CON EL SCRIPT) *****
      - /usr/local/share/osm_tiles_offline:/usr/local/share/osm_tiles_offline:ro
      # ***** DATOS DE ELEVACIÓN (SRTM) *****
      - /opt/srtm:/opt/srtm:ro
      # ***** SCRIPT CGI DE ELEVACIÓN (SE COPIA DESDE EL REPO) *****
      - ./scripts/get_elevation.sh:/usr/lib/cgi-bin/get_elevation.sh:ro
      # ***** ARCHIVOS GENERADOS POR READSB (EN LA RAM DEL HOST) *****
      - /run/readsb-a:/run/readsb-a:ro
      - /run/readsb-b:/run/readsb-b:ro
      - /run/readsb-c:/run/readsb-c:ro
      - /run/readsb-d:/run/readsb-d:ro
      # ***** HISTORIAL DE REPLAY *****
      - /var/globe_history:/var/globe_history:ro
      # ***** CONFIGURACIÓN PERSONALIZADA DE NGINX *****
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # ***** DEPENDENCIAS (EL CONTENEDOR WEB ESPERA A QUE EL AUTH ESTÉ LISTO) *****
    depends_on:
      - auth

  # ***** CONTENEDOR BACKEND (FLASK/GUNICORN) *****
  auth:
    # ***** INDICA QUÉ DOCKERFILE USAR *****
    build:
      context: .
      dockerfile: Dockerfile.auth
    # ***** NOMBRE DEL CONTENEDOR *****
    container_name: adsb_auth
    # ***** POLÍTICA DE REINICIO *****
    restart: unless-stopped
    # ***** VOLÚMENES (CÓDIGO Y BASE DE DATOS) *****
    volumes:
      # ***** CÓDIGO PYTHON (PARA DESARROLLO, SE PUEDE QUITAR EN PRODUCCIÓN) *****
      - ./auth:/app
      # ***** BASE DE DATOS SQLITE (PERSISTENTE EN EL HOST) *****
      - ./data:/app/data
    # ***** VARIABLES DE ENTORNO *****
    environment:
      - FLASK_ENV=production

  # ***** CONTENEDOR DE PLANES DE VUELO (DJANGO) *****
  flight-plans:
    # ***** USA EL DOCKERFILE DE LA CARPETA FLIGHT-PLANS *****
    build:
      context: ./flight-plans
      dockerfile: Dockerfile
    container_name: adsb_flight_plans
    restart: unless-stopped
    # ***** VOLÚMENES (CÓDIGO Y BASE DE DATOS POSTGRESQL) *****
    volumes:
      - ./flight-plans:/code
      - flight_plans_db:/var/lib/postgresql/data
    # ***** VARIABLES DE ENTORNO PARA DJANGO *****
    environment:
      - DJANGO_ALLOWED_HOSTS=*
    # ***** DEPENDENCIAS (ESPERA A QUE LA BASE DE DATOS ESTÉ LISTA) *****
    depends_on:
      - flight-plans-db

  # ***** CONTENEDOR DE BASE DE DATOS (POSTGRESQL) *****
  flight-plans-db:
    # ***** IMAGEN OFICIAL DE POSTGRESQL *****
    image: postgres:15-alpine
    container_name: adsb_flight_plans_db
    restart: unless-stopped
    # ***** VARIABLES DE ENTORNO PARA POSTGRESQL *****
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # ***** VOLUMEN PERSISTENTE PARA LOS DATOS *****
    volumes:
      - flight_plans_db:/var/lib/postgresql/data

# ***** DECLARACIÓN DE VOLÚMENES NOMBRADOS (PERSISTENTES) *****
volumes:
  flight_plans_db: